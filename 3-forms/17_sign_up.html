<!DOCTYPE html>
<html>
  <head>
    <title>Sign Up Page</title>
  </head>
  <body>
    <form>
      <h2>Sign Up Page</h2>
      Username: <input type="text" minlength="3" maxlength="20" required>
      <br><br>
      Email: <input type="email" required>
      <br><br>
      Password: <input type="password" minlength="8" maxlength="64" required>
      <br><br>
      Confirm Password: <input type="password" minlength="4" maxlength="10" required>
      <br><br>
      <input type="submit">
    </form>
  </body>
</html>
